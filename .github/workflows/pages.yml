name: pages

# Publishes the site in site/ to GitHub Pages when it changes on main. The page has no build
# step: the folder is uploaded as it is, with npm's download count written into it.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/tools/site-downloads.mjs
      - .github/workflows/pages.yml
  # Once a day, so the download count on the page follows npm's, which npm counts by day.
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A run in progress is let finish; a newer one waits for it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish the site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Leaves the line hidden when npm does not answer, and never stops the site from going out.
      - name: Add the npm download count
        run: node docs/tools/site-downloads.mjs site
        continue-on-error: true
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
